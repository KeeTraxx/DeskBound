# DeskBound enemies.
#
# Compile with:  python3 tools/gen_enemies.py
# That writes the GB Studio custom script "BattleScript", which the battle
# scene runs On Init. The overworld picks the fight by setting `enemy_id`
# before switching to the battle scene (see the Coffee Machine actor).
#
# `sprite` is a .png file under assets/sprites/ — the path as it sits on disk
# ("INVIS.png", or "enemies/coffee.png" in a subfolder), not GB Studio's
# internal sprite name.
#
# Every text field is a VARIANT string, or a list of them:
#
#   look:
#     - "First variant, shown across as many boxes as it needs."
#     - "Second variant, shown instead."
#
# One variant is picked at random each time the line comes up. Add variants
# freely — the repeated lines (enemy moves, damage reports) are where a fight
# starts to feel stale. Just write flowing prose: generation measures every
# word against the real font (assets/fonts/gbs-var.png) and wraps each line to
# the text box's actual pixel width, then starts a new dialogue box every
# MAX_TEXT_LINES (3) lines — no \n needed for either kind of break. It prints
# how many lines it had to wrap, which is worth a skim in case a wrap lands
# somewhere awkward.
#
# \n still works if you want to force a break by hand — most useful as \n\n
# for a deliberate blank line (see the reward text below, which pauses before
# the "+N Energy" line on purpose).
#
# Winning can hand some of it back: an enemy's optional `reward` block raises
# player_energy, player_energy_max and/or player_brains. Amounts take the same
# forms as damage (5, "3-6", [3, 6]). A max_energy gain also adds the same
# amount to current Energy, so the bar never looks emptier for getting bigger,
# and an energy gain is clamped to the maximum. Put the number in the text
# yourself — reward text has no {amount} placeholder.
#
# The player's Energy is NOT set here: player_energy and
# player_energy_max are globals owned by the overworld, so they carry across
# battles. BattleScript only ever subtracts from them.
#
# Damage ranges are inclusive and may be written as 5, "3-6" or [3, 6].
# Any text may use {damage}, {player_energy}, {player_energy_max},
# {enemy_energy}, {enemy_energy_max} and {turn} — they are replaced with
# GB Studio variable interpolation.

# Energy meters. A bar is an actor you place in the battle scene, using a
# sprite with one frame per fill level; BattleScript sets the frame through the
# generated "SetBar" script whenever Energy changes, via its PlayerBar and
# EnemyBar actor parameters. (A bar cannot poll its own value in an On Update
# script: the battle runs in the scene's On Init, which holds the VM lock for
# the whole fight, so no other thread runs.) Give each bar actor Animation
# Speed: None, or the engine cycles the frames by itself. Delete this section
# to drop the bars and their parameters entirely.
bars:
  sprite: energy_bar.png
  frames: 17         # fill levels in the strip, empty (0) through full
  width: 64          # px; must be a multiple of 8, one 8px column per sprite
  height: 8          # px tall, centred in the 16px sprite cell

# Hand-written scripts to call when the battle moves a value. Resolved by name
# from project/scripts/ — this tool reads the script's parameter list and never
# rewrites the script itself. player_changed fires on every write to
# player_energy (each time the enemy lands a hit, plus once at battle start so
# a HUD can draw the current value); player_fainted fires once when Energy hits
# 0, after the lose text — that is where going home and sleeping belongs. Hooks
# are called with no arguments — read the globals you need directly.
hooks:
  player_changed: PlayerValuesChanged
  player_fainted: Faint

# The ACT submenu, in order. Every enemy must answer for each verb.
actions: [THINK, TALK, EMAIL, SHRUG]

menu:
  act: ACT
  look: LOOK
  flee: FLEE

flee:
  chance: 3          # succeeds 3 times out of...
  out_of: 4
  success:
    - "You walk away. The problem remains, but so do you."
    - "You quietly leave. Noone notices..."
    - "The rule of the two legs. You proudly leave."
  failed:
    - "You get as far as the door and remember you need coffee."
    - "You take one step. Someone says your name."
    - "You reach for your bag. You put it back down."
  blocked:
    - "You can't leave. It's in your calendar."

messages:
  # The Energy bars report the totals, so there is no per-round readout.
  # Add one back by defining `status`, e.g.:
  #   status:
  #     - "YOU  {player_energy}/{player_energy_max}\nTHEM {enemy_energy}/{enemy_energy_max}"
  hit:
    - "It loses {damage} Energy."
    - "{damage} Energy. It felt that."
    - "That's {damage} off its Energy."
  no_effect:
    - "It barely notices."
    - "Nothing happens. Nothing at all."
    - "It does not react. It rarely does."
  player_hit:
    - "You lose {damage} Energy."
    - "{damage} Energy. You breathe through it."
    - "That's {damage} you won't get back."

lose:
  - "You have run out of Energy. You quietly gather your things. You go home early. Nobody notices.\n\nTomorrow, you try again."
  - "Your Energy is gone. You put on your coat with great dignity. You go home early. Nobody notices.\n\nTomorrow, you try again."

enemies:
  # `id` is what the overworld puts in enemy_id before switching to the battle
  # scene. It may start at 0, which lets a picker use a bare rnd(n) — but note
  # that a GB Studio variable starts at 0 too, so an enemy 0 is also whatever
  # an *unset* enemy_id selects. Omit `id` and it defaults to the position in
  # this list, counting from 1.
  #
  # take_damage keeps one variant per verb on purpose: those lines teach the
  # enemy's weakness, and a lesson reads better when it reads the same twice.
  # --- The commute (ids 0-4) --------------------------------------------
  # Picked at random by the street scene: enemy_id = rnd(5). Short fights,
  # small stakes — you are trying to get to work, not win anything.
  - id: 0
    name: Dog
    sprite: enemy_dog.png
    energy: 18
    intro:
      - "A DOG launches itself into the road. It is happy to see you."
      - "A DOG tries to ruin your day! You try your best to ignore it."
    look:
      - "No collar, no owner, no plan."
      - "It looks cute. You want to pet it... But you have to go to work!"
      - "It has the face of an animal never once told no."
    defeat:
      - "The dog loses interest and trots off to ruin someone else's morning."
    reward:
      energy: 2
      text:
        - "It was, briefly, nice.\n\n+2 Energy."
    take_damage:
      THINK:
        damage: 4-7
        text:
          - "You calculate its trajectory. The dog does not use trajectories."
      TALK:
        damage: 9-14
        text:
          - "You say GOOD BOY in the voice. It has no defence against this."
      EMAIL:
        damage: 1-3
        text:
          - "You email nobody. It is a dog. It does not have an inbox."
      SHRUG:
        damage: 6-10
        text:
          - "You stop pedalling and wait. The dog respects this enormously."
    moves:
      - text:
          - "It barks at your front wheel, for the wheel's own good."
          - "It keeps pace with you, delighted."
        damage: 2-4
      - text:
          - "It stops dead. It has seen another dog."
          - "It circles back to check you are still fun."
        damage: 3-5
      - text:
          - "It stares. You blink first."
        damage: 0-2

  - id: 1
    name: Grandma
    sprite: enemy_grandma.png
    energy: 22
    intro:
      - "A GRANDMOTHER begins crossing. The lights are in her favour."
    look:
      - "She is 40% across. She has been 40% across for some time."
      - "Her shopping trolley has one wheel that disagrees with the others."
    defeat:
      - "She reaches the kerb. She nods at you. You have been approved."
    reward:
      energy: 3
      text:
        - "She gives you a sweet from 2011.\n\n+3 Energy."
    take_damage:
      THINK:
        damage: 5-8
        text:
          - "You work out she has right of way. She had it regardless."
      TALK:
        damage: 7-11
        text:
          - "You say good morning. She says something about the weather."
      EMAIL:
        damage: 1-3
        text:
          - "There is nobody to CC about a grandmother."
      SHRUG:
        damage: 10-15
        text:
          - "You wait. This turns out to be the entire solution."
    moves:
      - text:
          - "She stops to check her list. It is a long list."
          - "She reads a receipt in the middle of the road."
        damage: 2-4
      - text:
          - "She waves you on, then does not move."
          - "You wave her on. She waves you on. Nobody moves."
        damage: 3-5
      - text:
          - "A second grandmother joins her."
        damage: 0-3
      - text:
          - "She wants to introduce you to her unnmarried grandkid. You are shocked by her boldness!"
        damage: 0-5

  - id: 2
    name: Boss Call
    sprite: enemy_boss_call.png
    energy: 25
    intro:
      - "YOUR PHONE RINGS. It is your boss. You are not in yet."
    look:
      - "The screen says QUICK QUESTION. It is never a quick question."
      - "Three missed calls, all in the last ninety seconds."
    defeat:
      - "The call ends. You have agreed to nothing. A small miracle."
    reward:
      brains: 1
      text:
        - "You have learned the shape of a deflection.\n\n+1 Brains."
    take_damage:
      THINK:
        damage: 5-9
        text:
          - "You rehearse a reason for being late. All of them are true."
      TALK:
        damage: 4-8
        text:
          - "You answer. You say the word \"circling\". It buys you a minute."
      EMAIL:
        damage: 12-18
        text:
          - "\"I'll put that in an email.\" The call loses all of its power."
      SHRUG:
        damage: 6-10
        text:
          - "You let it ring. A ring is only a sound."
    moves:
      - text:
          - "\"Quick question -\""
          - "\"Sorry, one more thing -\""
        damage: 3-6
      - text:
          - "\"Are you in yet?\""
          - "\"Did you see my message?\""
        damage: 2-5
      - text:
          - "It calls again. Immediately."
        damage: 4-7

  - id: 3
    name: Tractor
    sprite: enemy_tractor.png
    energy: 30
    intro:
      - "A TRACTOR pulls out. It is doing eleven. The road is single lane."
    look:
      - "The trailer is stacked with something damp. Some of it is leaving."
      - "A sticker on the back: HOW'S MY DRIVING. There is no number."
    defeat:
      - "It turns off into a field. You are free. You had earned it."
    reward:
      energy: 2
      text:
        - "You had time to think back there.\n\n+2 Energy."
    take_damage:
      THINK:
        damage: 11-16
        text:
          - "You find the one straight stretch and take it. Textbook."
      TALK:
        damage: 2-5
        text:
          - "You say something polite. Nobody in there has heard anything since 1994."
      EMAIL:
        damage: 1-4
        text:
          - "You compose a strongly worded email to a field."
      SHRUG:
        damage: 7-11
        text:
          - "You accept eleven kilometres an hour. The hedges are nice."
    moves:
      - text:
          - "It indicates left for a very long time."
          - "It indicates left. It turns right."
        damage: 3-6
      - text:
          - "Mud arrives. Some of it is on you."
          - "Something falls off the trailer. It was probably important."
        damage: 4-7
      - text:
          - "It slows down for a reason you will never learn."
        damage: 2-5

  - id: 4
    name: Construction
    sprite: enemy_construction.png
    energy: 35
    can_flee: false
    flee_blocked:
      - "There is no way round. That is rather the point of a road."
      - "You look for a gap. The gap is a trench."
    intro:
      - "A CONSTRUCTION SITE. The road is gone. It was here yesterday."
    look:
      - "Four workers. One is digging. Three are supervising."
      - "The temporary lights have been temporary since spring."
    defeat:
      - "You find a way through. Someone waves you past like it was their idea."
    reward:
      brains: 1
      text:
        - "You know the back streets now.\n\n+1 Brains."
    take_damage:
      THINK:
        damage: 12-18
        text:
          - "You picture the map. There is a back street. Brains are for this."
      TALK:
        damage: 6-10
        text:
          - "You ask a worker. He points at another worker."
      EMAIL:
        damage: 3-6
        text:
          - "You email the council. An auto-reply thanks you for your patience."
      SHRUG:
        damage: 4-8
        text:
          - "You wait at the temporary lights. They are in no hurry."
    moves:
      - text:
          - "The light stays red. Nothing is coming the other way."
          - "The light turns green for one and a half cars."
        damage: 3-6
      - text:
          - "A man holds a STOP sign and a sandwich."
          - "The STOP sign turns to SLOW. Then back."
        damage: 2-5
      - text:
          - "The detour sign points at another detour sign."
        damage: 4-8

  # --- The office (ids 10-12) -------------------------------------------
  - id: 10
    name: Coffee Machine
    sprite: enemy_coffee_machine.png
    energy: 60
    win_flag: story_flag_coffee
    intro:
      - "A DIRTY COFFEE MACHINE blocks the counter. It is encrusted."
    look:
      - "Beneath the grime, a sticker: \"CLEAN ME :)\" It is from 2019."
      - "Someone has written in the dust. You decide not to read it."
    defeat:
      - "The coffee machine is defeated. It dispenses, finally, a decent cup."
    reward:
      energy: 12
      text:
        - "You drink it. It is actually good.\n\n+12 Energy."
    take_damage:
      THINK:
        damage: 12-18
        text:
          - "Nobody has descaled it since 2019. It shudders, seen at last."
      TALK:
        damage: 4-8
        text:
          - "You talk to it. It gurgles noncommittally."
      EMAIL:
        damage: 3-6
        text:
          - "You email Facilities. Auto-closed as a duplicate ticket."
      SHRUG:
        damage: 9-14
        text:
          - "You drink it black and bitter, like it wants. It respects this."
    moves:
      - text:
          - "It dispenses something at exactly body temperature."
          - "It produces a liquid. The liquid is, at best, within spec."
        damage: 5-9
      - text:
          - "It drips. Onto the counter you just cleaned."
          - "It gurgles, then stops. Then gurgles again. Just to be sure."
        damage: 3-7
      - text:
          - "OUT OF BEANS, it announces, with beans clearly visible."
          - "DESCALE REQUIRED, it says, having required this since 2019."
        damage: 0-2

  - id: 11
    name: The Printer
    sprite: enemy_the_printer.png
    energy: 65
    win_flag: story_flag_printer
    intro:
      - "THE PRINTER stirs. It has never worked. It is not sorry."
    look:
      - "Tray 2 is open. Tray 2 is always open. There is nothing in tray 2."
      - "A queue of 47 jobs. None of them yours. None of them recent."
    defeat:
      - "The printer is defeated. It prints your document. It prints it correctly."
    reward:
      energy: 8
      brains: 1
      text:
        - "You know its ways now.\n\n+8 Energy, +1 Brains."
    take_damage:
      THINK:
        damage: 3-6
        text:
          - "You deduce the jam is in tray 2. There is no jam in tray 2."
      TALK:
        damage: 4-8
        text:
          - "You say \"please.\" It emits one sheet of a document from 2017."
      EMAIL:
        damage: 16-22
        text:
          - "You CC the office manager. Bureaucracy is the only language it fears."
      SHRUG:
        damage: 6-10
        text:
          - "You walk away. It beeps, wounded by the indifference."
    moves:
      - text:
          - "PC LOAD LETTER. Nobody has ever known what this means."
          - "It asks for a paper size that has not been made since 1998."
        damage: 5-9
      - text:
          - "It reports a paper jam. There is no paper. There is no jam."
          - "It jams. On the one page you actually needed."
        damage: 4-8
      - text:
          - "TONER LOW, it says, at 94% toner."
          - "It prints a test page. Nobody asked for a test page."
        damage: 0-3

  - id: 12
    name: The Meeting
    sprite: enemy_the_meeting.png
    energy: 105
    win_flag: story_flag_boss
    can_flee: false
    flee_blocked:
      - "You can't leave. It's in your calendar."
      - "You stand up. Eleven people look at you. You sit back down."
      - "The invite has no decline button. You check. Twice."
    intro:
      - "THE MEETING THAT COULD'VE BEEN AN EMAIL begins. It has no agenda."
    look:
      - "Twelve attendees. Eleven are on mute. One is eating."
      - "The agenda field is empty. It has always been empty."
    defeat:
      - "The meeting ends. It is 17:02. You are free. You go home."
    reward:
      max_energy: 10
      brains: 2
      text:
        - "You survived the unsurvivable. Something in you hardened. +10 Max Energy, +2 Brains."
    take_damage:
      THINK:
        damage: 7-11
        text:
          - "You work out what this meeting is for: nothing. Knowing does not help."
      TALK:
        damage: 14-20
        text:
          - "You say the quiet part: \"Could this have been an email?\""
      EMAIL:
        damage: 8-12
        text:
          - "You send the follow-up email DURING the meeting. Deeply illegal. Effective."
      SHRUG:
        damage: 7-10
        text:
          - "You stop resisting. You let it wash over you."
    moves:
      - text:
          - "Let's circle back to that."
          - "Someone shares the wrong screen. We all wait."
        damage: 5-8
      - text:
          - "This'll be quick, it says. It is 45 minutes."
          - "Sorry, you go ahead. No, you go ahead. No, you go ahead."
        damage: 4-7
      - text:
          - "Any other business? Someone has other business."
          - "Can everyone see my screen? Nobody can see the screen."
        damage: 6-9

  # --- Office tasks (ids 20-24) -----------------------------------------
  # The work itself, taken on at your own desk. Short fights, no story flags:
  # these are the ones you can lose and still come back to tomorrow.
  - id: 20
    name: Presentation
    sprite: enemy_presentation.png
    energy: 28
    intro:
      - "A PRESENTATION is due tomorrow. It exists only as a title."
    look:
      - "Slide 1 of 1. The title is \"Overview\". There is nothing to overview."
      - "You have a template. The template has a placeholder logo."
    defeat:
      - "The deck is finished. It is fourteen slides. Two of them are good."
    reward:
      brains: 1
      text:
        - "You found the story in it somewhere.\n\n+1 Brains."
    take_damage:
      THINK:
        damage: 13-19
        text:
          - "You decide what it's actually about. The rest is only slides."
      TALK:
        damage: 5-9
        text:
          - "You explain it out loud to a colleague. It gets shorter."
      EMAIL:
        damage: 2-5
        text:
          - "You ask for the brand template. It arrives as a PDF."
      SHRUG:
        damage: 6-10
        text:
          - "You reuse last quarter's deck. Nobody read it the first time."
    moves:
      - text:
          - "The font does something different on slide 6."
          - "You drag one image. The whole layout moves."
        damage: 4-7
      - text:
          - "The chart has no axis labels. It never had axis labels."
          - "Animations. You did not ask for animations."
        damage: 3-6
      - text:
          - "It autosaves. Over the good version."
        damage: 2-5

  - id: 21
    name: The Inbox
    sprite: enemy_the_inbox.png
    energy: 32
    intro:
      - "THE INBOX opens. Unread: 141. It was 138 a moment ago."
    look:
      - "Forty are CCs. Twelve are from you. Nine are about parking."
      - "One is marked URGENT. It is from a mailing list."
    defeat:
      - "Inbox zero. It lasts about four minutes. You were there for it."
    reward:
      energy: 5
      text:
        - "Briefly, nothing is owed.\n\n+5 Energy."
    take_damage:
      THINK:
        damage: 4-8
        text:
          - "You sort by sender. You now have sorted problems."
      TALK:
        damage: 7-11
        text:
          - "You walk over and ask. It takes nine seconds. It saved nine emails."
      EMAIL:
        damage: 14-20
        text:
          - "You answer fire with fire. Here, and only here, that works."
      SHRUG:
        damage: 3-7
        text:
          - "You mark all as read. They are not read. They are marked."
    moves:
      - text:
          - "Reply all. Someone has replied all."
          - "A thread you were CC'd on has opinions now."
        damage: 3-6
      - text:
          - "\"Per my last email.\""
          - "\"Just following up on this.\" It is the fourth follow-up."
        damage: 4-7
      - text:
          - "Out of office, says the one person you needed."
          - "Three more arrive while you read one."
        damage: 2-5

  - id: 22
    name: Backlog Grooming
    sprite: enemy_backlog_grooming.png
    energy: 36
    intro:
      - "BACKLOG GROOMING begins. The backlog has 400 items. None are groomed."
    look:
      - "The oldest ticket is from 2021. It says \"TBD\"."
      - "Four tickets describe the same bug. None of them agree."
    defeat:
      - "Eleven closed. Seven merged. One is now somebody else's."
    reward:
      brains: 1
      text:
        - "You can see the shape of the work now.\n\n+1 Brains."
    take_damage:
      THINK:
        damage: 12-17
        text:
          - "You close everything older than a year. Nothing breaks."
      TALK:
        damage: 8-12
        text:
          - "You ask who wants this. Nobody does. It's gone."
      EMAIL:
        damage: 3-6
        text:
          - "You email the reporter. The reporter left in March."
      SHRUG:
        damage: 5-9
        text:
          - "You drag them all to Next Quarter. Next Quarter is very patient."
    moves:
      - text:
          - "Someone reopens a ticket you just closed."
          - "A ticket has no description. It has three watchers."
        damage: 3-6
      - text:
          - "\"Shall we size it?\" It cannot be sized."
          - "Everyone votes 5. One person votes 13. We discuss this for a while."
        damage: 4-7
      - text:
          - "Priority: Medium. Everything is priority medium."
        damage: 2-5

  - id: 23
    name: The Contract
    sprite: enemy_the_contract.png
    energy: 40
    intro:
      - "THE CONTRACT needs writing. Legal is available in principle."
    look:
      - "Clause 4 refers to Appendix B. There is no Appendix B."
      - "The template is a Word file with tracked changes from 2019."
    defeat:
      - "It is signed. Both sides are equally unhappy. That's the job."
    reward:
      energy: 3
      brains: 1
      text:
        - "You know which clauses matter now.\n\n+3 Energy, +1 Brains."
    take_damage:
      THINK:
        damage: 9-14
        text:
          - "You read it properly. All of it. Rarer than you would think."
      TALK:
        damage: 4-8
        text:
          - "You call Legal. Legal is in a workshop until Thursday."
      EMAIL:
        damage: 13-18
        text:
          - "You put every change in writing. Paper beats paper."
      SHRUG:
        damage: 3-6
        text:
          - "You accept their terms. Future you can handle clause 9."
    moves:
      - text:
          - "Track changes has tracked a change to a comma."
          - "Two versions are called FINAL. They differ."
        damage: 4-8
      - text:
          - "A new redline arrives. It redlines the redline."
          - "Procurement adds a field. The field is mandatory."
        damage: 3-6
      - text:
          - "The PDF is a scan of a print of a PDF."
        damage: 2-5

  - id: 24
    name: Pair Programming
    sprite: enemy_pair_programming.png
    energy: 34
    intro:
      - "PAIR PROGRAMMING. One keyboard. Two opinions. No plan."
    look:
      - "Their editor has forty plugins. Yours has the default theme."
      - "The branch is called temp2-final-fix-v3."
    defeat:
      - "It works. Neither of you is sure which of you made it work."
    reward:
      brains: 2
      text:
        - "You picked up three shortcuts and a habit.\n\n+2 Brains."
    take_damage:
      THINK:
        damage: 7-11
        text:
          - "You read the error message. Out loud. It was the answer."
      TALK:
        damage: 13-19
        text:
          - "You say what you're about to type before you type it. It clicks."
      EMAIL:
        damage: 1-4
        text:
          - "You email them. They are sitting next to you."
      SHRUG:
        damage: 5-9
        text:
          - "You hand over the keyboard and let it happen."
    moves:
      - text:
          - "\"Can I drive?\" They are already driving."
          - "They reformat the file. The diff is now 400 lines."
        damage: 3-6
      - text:
          - "A tab-vs-space incident. It lasts nine minutes."
          - "\"That's not how I'd do it.\" It compiles either way."
        damage: 4-7
      - text:
          - "The shared session drops. Twice."
          - "They take a call. The cursor sits blinking."
        damage: 2-5

  # --- The project manager (ids 30-33) ----------------------------------
  # Fights where the enemy is holding something you want: a rating, a budget,
  # a fortnight in July. Longer, and the rewards are permanent.
  - id: 30
    name: Appraisal
    sprite: enemy_appraisal.png
    energy: 45
    can_flee: false
    flee_blocked:
      - "You can't leave. It is about you."
      - "The door is closed. It was closed carefully."
    intro:
      - "THE APPRAISAL begins. A form is open. Your name is on it."
    look:
      - "Six competencies, rated 1 to 5. Nobody has ever been given a 5."
      - "Last year's goals are here. You recognise none of them."
    defeat:
      - "\"Meets expectations.\" You have survived another year."
    reward:
      max_energy: 5
      text:
        - "You made your case and it landed.\n\n+5 Max Energy."
    take_damage:
      THINK:
        damage: 8-12
        text:
          - "You remember the thing in March that went well. It counts."
      TALK:
        damage: 12-17
        text:
          - "You say what you did, plainly, without apologising for it."
      EMAIL:
        damage: 6-10
        text:
          - "You produce the thread proving you flagged it in January."
      SHRUG:
        damage: 2-5
        text:
          - "You say it was a team effort. It was. That helps nobody here."
    moves:
      - text:
          - "\"Where do you see yourself in five years?\""
          - "\"Let's talk about your development areas.\""
        damage: 4-8
      - text:
          - "\"Budget is tight this year.\" It is tight every year."
          - "A number appears. It is smaller than the one you said."
        damage: 5-9
      - text:
          - "\"How do you think it went?\" You have to go first."
        damage: 3-6

  - id: 31
    name: Funding Round
    sprite: enemy_funding_round.png
    energy: 50
    intro:
      - "You ask for FUNDING for a new project. The room goes quiet."
    look:
      - "The budget sheet has a tab called DO NOT EDIT. Someone edited it."
      - "There is money. It is allocated to something nobody remembers."
    defeat:
      - "It's approved. Not all of it. Enough of it."
    reward:
      brains: 2
      text:
        - "You learned where the money actually lives.\n\n+2 Brains."
    take_damage:
      THINK:
        damage: 12-18
        text:
          - "You build the business case on one slide. One slide is enough."
      TALK:
        damage: 6-10
        text:
          - "You name a competitor who already did it. The room shifts."
      EMAIL:
        damage: 8-12
        text:
          - "You forward the angry customer email. It is urgent now."
      SHRUG:
        damage: 2-5
        text:
          - "You say it would be nice to have. It is now a nice-to-have."
    moves:
      - text:
          - "\"What's the ROI?\" You do not have an ROI."
          - "\"Can we do it with existing headcount?\""
        damage: 4-8
      - text:
          - "\"Let's revisit this next quarter.\""
          - "It goes to the parking lot. The parking lot is where things die."
        damage: 5-8
      - text:
          - "Someone asks what it costs to do nothing. Nobody answers."
        damage: 3-6

  - id: 32
    name: Business Meeting
    sprite: enemy_business_meeting.png
    energy: 42
    intro:
      - "A BUSINESS MEETING. External guests. Good chairs. No agenda."
    look:
      - "Everyone has a laptop. Nobody is taking notes."
      - "There is a plate of pastries. Nobody will go first."
    defeat:
      - "Hands are shaken. A follow-up is promised. It may even happen."
    reward:
      energy: 4
      text:
        - "The pastries were, in the end, yours.\n\n+4 Energy."
    take_damage:
      THINK:
        damage: 5-9
        text:
          - "You work out who in the room decides. It is not who is talking."
      TALK:
        damage: 12-17
        text:
          - "You ask what they actually need. Nobody had asked them yet."
      EMAIL:
        damage: 7-11
        text:
          - "You send the recap before they do. Yours is the version now."
      SHRUG:
        damage: 3-7
        text:
          - "You let the silence run. Someone else fills it."
    moves:
      - text:
          - "\"Just to give a bit of background -\" It is fifteen minutes."
          - "Someone introduces themselves for the second time."
        damage: 3-7
      - text:
          - "A deck appears. Sixty slides. \"We'll go quickly.\""
          - "\"Let's take that offline.\" Nothing ever goes offline."
        damage: 4-7
      - text:
          - "The room is booked until 10. It is 10."
        damage: 2-5

  - id: 33
    name: Vacation Request
    sprite: enemy_vacation_request.png
    energy: 38
    intro:
      - "You request VACATION. The form is simple. The conversation is not."
    look:
      - "The team calendar shows two others away. One until October."
      - "Your balance says 26 days. It has said 26 days for two years."
    defeat:
      - "Approved. Two weeks. They are real and they are yours."
    reward:
      max_energy: 8
      text:
        - "Something to aim at.\n\n+8 Max Energy."
    take_damage:
      THINK:
        damage: 11-16
        text:
          - "You pick the week when nothing ships. There is always one week."
      TALK:
        damage: 5-9
        text:
          - "You say it out loud early. Early is the whole trick."
      EMAIL:
        damage: 9-13
        text:
          - "You submit it in the system. The system does not negotiate."
      SHRUG:
        damage: 2-5
        text:
          - "You say you're flexible. You are now flexible until November."
    moves:
      - text:
          - "\"Those are busy weeks for us.\" Every week is."
          - "\"Can you be reachable?\""
        damage: 4-7
      - text:
          - "Someone booked the same week. They booked it this morning."
          - "\"Who's covering for you?\" Nobody. Ever."
        damage: 3-6
      - text:
          - "The approval sits unread for nine days."
        damage: 2-5

  # --- The meeting room (ids 40-43) -------------------------------------
  # Same four walls, four different ways to lose an hour.
  - id: 40
    name: Standup
    sprite: enemy_standup.png
    energy: 26
    can_flee: false
    flee_blocked:
      - "It's fifteen minutes. It has been fifteen minutes for an hour."
      - "You are next. Everyone is waiting for you to be next."
    intro:
      - "THE STANDUP. Everyone is standing. Nobody remembers why."
    look:
      - "Nine people. Fifteen minutes. The maths has never worked."
      - "One person is on a call from a car."
    defeat:
      - "It ends at 09:23. Nothing was decided. Everything was said."
    reward:
      energy: 3
      text:
        - "At least you know what everyone is doing.\n\n+3 Energy."
    take_damage:
      THINK:
        damage: 6-10
        text:
          - "You decide what matters before your turn. It is one thing."
      TALK:
        damage: 10-15
        text:
          - "Three sentences. No blockers. You stop talking first."
      EMAIL:
        damage: 3-6
        text:
          - "You post your update in the channel. Two people read it."
      SHRUG:
        damage: 4-8
        text:
          - "\"Same as yesterday.\" It is allowed. It is also true."
    moves:
      - text:
          - "Someone gives a full sprint history."
          - "\"Quick one -\" It is not a quick one."
        damage: 3-5
      - text:
          - "Two people start solving it. Here. Now. In front of everyone."
          - "\"Let's take that offline.\" They do not take it offline."
        damage: 4-6
      - text:
          - "The laptop dies. The board is on the laptop."
          - "Someone joins at 09:14."
        damage: 1-4

  - id: 41
    name: Tech Talk
    sprite: enemy_tech_talk.png
    energy: 44
    intro:
      - "You give a TECH TALK. Twenty people. One of them wrote the thing."
    look:
      - "The room seats twelve. The invite went to forty."
      - "The front row is empty. It is always empty."
    defeat:
      - "Applause, the polite kind. Two people stay to ask more."
    reward:
      brains: 2
      text:
        - "Explaining it taught you it properly.\n\n+2 Brains."
    take_damage:
      THINK:
        damage: 8-12
        text:
          - "You cut the middle third. Nobody misses it."
      TALK:
        damage: 13-18
        text:
          - "You drop the slides and just explain it. The room wakes up."
      EMAIL:
        damage: 2-5
        text:
          - "You share the deck afterwards. It is not the same thing."
      SHRUG:
        damage: 5-9
        text:
          - "\"I don't know.\" The room relaxes. So do you."
    moves:
      - text:
          - "The HDMI does not. It simply does not."
          - "Your laptop mirrors at the wrong resolution."
        damage: 4-8
      - text:
          - "A question that is actually a statement."
          - "\"Have you considered Rust?\" It is not about Rust."
        damage: 3-7
      - text:
          - "Someone eats lunch loudly in row two."
          - "Half the room is reading email."
        damage: 2-5

  - id: 42
    name: Finance Review
    sprite: enemy_finance_review.png
    energy: 55
    intro:
      - "THE FINANCE REVIEW. A spreadsheet is on the wall. It is large."
    look:
      - "Column M is red. Nobody will say the word \"overspend\"."
      - "The forecast was made in January. It is not January."
    defeat:
      - "The numbers hold. You keep your budget. Most of it."
    reward:
      energy: 4
      brains: 1
      text:
        - "You can read the sheet now.\n\n+4 Energy, +1 Brains."
    take_damage:
      THINK:
        damage: 14-20
        text:
          - "You find the line counted twice. It was there all along."
      TALK:
        damage: 5-9
        text:
          - "You explain the variance in one sentence. It lands."
      EMAIL:
        damage: 7-11
        text:
          - "You attach the approval from March. Signed. Dated."
      SHRUG:
        damage: 2-6
        text:
          - "You let them reallocate it. It comes back in Q3. It usually does."
    moves:
      - text:
          - "\"Can you walk us through row 41?\""
          - "The total does not match the total on the other slide."
        damage: 5-9
      - text:
          - "A cost centre you have never heard of is yours."
          - "\"That's over budget.\" It is over by 2%."
        damage: 4-8
      - text:
          - "Someone opens the file in a different currency."
          - "The projector cuts off column P. Column P was the point."
        damage: 2-6

  - id: 43
    name: The Candidate
    sprite: enemy_the_candidate.png
    energy: 40
    can_flee: false
    flee_blocked:
      - "They are already in the room. You cannot unstart this."
      - "HR is taking notes. On both of you."
    intro:
      - "A CANDIDATE INTERVIEW. They are nervous. So, quietly, are you."
    look:
      - "Their CV is two pages. One of them is skills with progress bars."
      - "You were given the CV four minutes ago."
    defeat:
      - "You write it up. Yes, with reasons. It is a good hire."
    reward:
      brains: 2
      text:
        - "You know what you're hiring for now.\n\n+2 Brains."
    take_damage:
      THINK:
        damage: 9-13
        text:
          - "You decide what the role needs before you ask anything."
      TALK:
        damage: 12-18
        text:
          - "You ask about a real problem they solved. They come alive."
      EMAIL:
        damage: 2-5
        text:
          - "You send the feedback form. The form has twelve fields."
      SHRUG:
        damage: 4-8
        text:
          - "You let them ask the questions for a while. You learn more."
    moves:
      - text:
          - "\"What's your biggest weakness?\" You hear yourself ask it."
          - "They ask about culture. You hear yourself say \"like a family\"."
        damage: 4-7
      - text:
          - "A whiteboard question you could not do yourself."
          - "The room is booked over. Someone opens the door."
        damage: 3-6
      - text:
          - "Silence. They wait. You wait. HR writes something down."
        damage: 2-5

  # --- Tech fixes (ids 50-53) -------------------------------------------
  # Nothing is broken. Everything is broken. You are the one standing there.
  - id: 50
    name: The Beamer
    sprite: enemy_the_beamer.png
    energy: 30
    intro:
      - "THE BEAMER will not find the laptop. Nine people are watching."
    look:
      - "Three cables. Two adapters. One of them is somebody's."
      - "INPUT: HDMI 2. There is no HDMI 2."
    defeat:
      - "The picture appears. The room exhales. You have done a magic."
    reward:
      energy: 4
      text:
        - "Nine people are quietly grateful.\n\n+4 Energy."
    take_damage:
      THINK:
        damage: 12-17
        text:
          - "You try the other input. It was, of course, the other input."
      TALK:
        damage: 4-8
        text:
          - "You ask for a USB-C adapter. Two arrive. Neither fits."
      EMAIL:
        damage: 2-5
        text:
          - "You email IT. IT is on this floor. So is the beamer."
      SHRUG:
        damage: 7-11
        text:
          - "You unplug it, count to five, plug it back in. The oldest magic."
    moves:
      - text:
          - "NO SIGNAL, it says, with great confidence."
          - "The picture arrives. It is blue."
        damage: 3-6
      - text:
          - "It mirrors your desktop. Your desktop has seventy icons."
          - "The resolution is wrong. Everything is slightly oval."
        damage: 4-7
      - text:
          - "The remote has no batteries."
          - "The bulb warning comes on. It has been on for two years."
        damage: 1-4

  - id: 51
    name: The VPN
    sprite: enemy_the_vpn.png
    energy: 34
    intro:
      - "THE VPN will not connect. Everything you need is behind it."
    look:
      - "Error 809. The internet has twelve answers. None are about 809."
      - "The client updated itself overnight. Nobody asked it to."
    defeat:
      - "Connected. The little icon turns green. You touch nothing else."
    reward:
      brains: 1
      text:
        - "You know which toggle it was.\n\n+1 Brains."
    take_damage:
      THINK:
        damage: 13-18
        text:
          - "You check the clock. The clock was wrong. It is always the clock."
      TALK:
        damage: 2-5
        text:
          - "You ask the room. Everyone else is connected. Thank you."
      EMAIL:
        damage: 8-12
        text:
          - "You open a ticket with the exact error code. Rare enough to work."
      SHRUG:
        damage: 5-9
        text:
          - "You turn it off and on again. It is not nothing."
    moves:
      - text:
          - "AUTHENTICATION FAILED. The password is right."
          - "It connects. It drops. It connects."
        damage: 4-7
      - text:
          - "The token app wants a PIN you set in 2022."
          - "Certificate expired. It expired at 09:00 exactly."
        damage: 3-6
      - text:
          - "It is connected, but nothing resolves."
          - "IT asks whether you are on the VPN."
        damage: 2-5

  - id: 52
    name: The WiFi
    sprite: enemy_the_wifi.png
    energy: 28
    intro:
      - "THE WIFI drops. Then returns. Then drops. You are on a call."
    look:
      - "Four bars. Four confident, dishonest bars."
      - "GUEST, CORP, CORP-5G, CORP-OLD. Two of them work. Not these two."
    defeat:
      - "It holds. For now, it holds. You stop moving your laptop."
    reward:
      energy: 3
      text:
        - "You know which corner of the room works.\n\n+3 Energy."
    take_damage:
      THINK:
        damage: 8-12
        text:
          - "You work out it's the microwave. It is always the microwave."
      TALK:
        damage: 4-8
        text:
          - "You ask who else is dropping. Everyone is. It was never you."
      EMAIL:
        damage: 3-6
        text:
          - "You email IT. The email does not send. Of course it doesn't."
      SHRUG:
        damage: 12-17
        text:
          - "You move one metre to the left. Everything is fixed."
    moves:
      - text:
          - "\"You're breaking up.\" You were mid-sentence."
          - "It reconnects to the guest network. Quietly."
        damage: 3-6
      - text:
          - "A captive portal opens. You signed in an hour ago."
          - "The call drops to audio. Then to nothing at all."
        damage: 4-7
      - text:
          - "Someone starts a download."
          - "Connected, no internet. It is proud of the distinction."
        damage: 1-4

  - id: 53
    name: Update Required
    sprite: enemy_update_required.png
    energy: 32
    intro:
      - "UPDATE REQUIRED. It will take 40 minutes. It begins in five."
    look:
      - "Postpone: 1 hour. That button has been pressed eleven times."
      - "Version 4.2.1. Nobody knows what changed in 4.2.0 either."
    defeat:
      - "It restarts. It comes back. Everything is where you left it."
    reward:
      energy: 2
      brains: 1
      text:
        - "You saved everything first. You learn.\n\n+2 Energy, +1 Brains."
    take_damage:
      THINK:
        damage: 11-16
        text:
          - "You save it all and let it run now, rather than at 16:55."
      TALK:
        damage: 3-6
        text:
          - "You ask if anyone has done it. Everyone has postponed it."
      EMAIL:
        damage: 4-8
        text:
          - "You email IT to ask what's in it. Nobody knows what's in it."
      SHRUG:
        damage: 9-13
        text:
          - "You go and get a coffee. This is the intended solution."
    moves:
      - text:
          - "Restart now, or restart now?"
          - "It restarts. It was not done restarting."
        damage: 3-6
      - text:
          - "37% complete. It has said 37% for a while."
          - "DO NOT TURN OFF YOUR COMPUTER, it shouts."
        damage: 4-7
      - text:
          - "Your settings are back to default."
          - "It offers you a tour of the new features."
        damage: 2-5
